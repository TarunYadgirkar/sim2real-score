name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Core dependencies only. Tests for the optional torch / ONNX / SB3 /
      # MuJoCo backends skip cleanly when the backend is absent, so this job
      # exercises the analysis, sweep, sensitivity and report paths honestly
      # without pulling a deep-learning stack into CI.
      - run: pip install -e ".[dev]"
      - run: pytest -q
